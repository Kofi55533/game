name: Check model API key

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-secret:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify that the repository secret is available
        env:
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
        run: PYTHONPATH=src python -m tradinglab.secrets --require-model
