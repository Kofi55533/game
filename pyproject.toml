[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-agent-lab"
version = "0.1.0"
description = "Reproducible experiment planning for a trading agent"
requires-python = ">=3.11"

[project.scripts]
trading-plan = "tradinglab.cli:main"
trading-cost = "tradinglab.cost:main"
trading-check-secrets = "tradinglab.secrets:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
